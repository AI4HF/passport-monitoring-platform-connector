version: '3.8'

services:
  passport-monitoring-platform-connector:
    image: srdc/passport-monitoring-platform-connector:latest
    environment:
      CRON_SCHEDULE: "*/1 * * * *"
      PASSPORT_SERVER_URL: "http://passport-nginx:80/ai4hf/passport/api"
      STUDY_ID: "0197a6f8-2b78-71e4-81c1-b7b6a744ece3"
      # Required: the site (Passport organization id) this Monitoring Platform belongs to; only the federated
      # aggregate and this site's own evaluation runs are sent. "*" sends the runs of all organizations.
      # Supply it from the shell environment or a .env file next to this file.
      ORGANIZATION_ID: "${ORGANIZATION_ID:?Set ORGANIZATION_ID to this site's Passport organization id, or * for all organizations}"
      # Minutes an evaluation run is re-read for measures written after it was first seen (at least 15).
      RUN_SETTLE_MINUTES: "60"
      # Timeout of every HTTP request (Keycloak, Passport, Logstash), in seconds.
      REQUEST_TIMEOUT_SECONDS: "60"
      KEYCLOAK_SERVER_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "AI4HF-Authorization"
      CLIENT_ID: "ai4hf-monitoring-connector"
      # The service account secret. Supply it from the environment rather than committing it.
      CLIENT_SECRET: "${CLIENT_SECRET}"
      LOGSTASH_URL: "http://ai4hf-monitoring-logstash:5000"
      LOGSTASH_BASIC_AUTH: "bG9nc3Rhc2hfaW50ZXJuYWw6MnNnUWRIMEtySGE1YzJsUzBMR2c="
      # What was sent, on the persistent volume below; a new installation (no file) sends everything once.
      STATE_FILE: "/data/sent.json"
    volumes:
      - passport-monitoring-platform-connector-data:/data
    networks:
      - passport-network
      - ai4hf-monitoring

volumes:
  passport-monitoring-platform-connector-data:

networks:
  passport-network:
    name: passport-network
    external: true
  ai4hf-monitoring:
    name: ai4hf-monitoring
    driver: bridge